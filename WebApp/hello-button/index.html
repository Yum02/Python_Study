<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>안녕 버튼</title>
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      background-color: #f5f5f5;
      font-family: sans-serif;
    }
    #greeting {
      font-size: 48px;
      color: #333;
    }
    #toggle-btn {
      font-size: 20px;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
    }
    #toggle-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div id="greeting">안녕</div>
  <button id="toggle-btn" onclick="toggleGreeting()">클릭하세요</button>

  <script>
    const greetings = ["안녕", "반가워요!"];
    const buttonLabels = ["클릭하세요", "다시 클릭!"];
    let state = 0;

    function toggleGreeting() {
      state = 1 - state;
      document.getElementById("greeting").textContent = greetings[state];
      document.getElementById("toggle-btn").textContent = buttonLabels[state];
    }
  </script>
</body>
</html>
