<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>안녕 버튼</title>
  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      background: linear-gradient(135deg, #a18cd1, #fbc2eb, #fad0c4);
      font-family: sans-serif;
    }
    #emoji {
      font-size: 80px;
      transition: transform 0.3s ease;
    }
    #greeting {
      font-size: 52px;
      font-weight: bold;
      background: linear-gradient(90deg, #ff5f6d, #ffc371);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      transition: background 0.3s ease;
    }
    #toggle-btn {
      font-size: 20px;
      padding: 12px 28px;
      border: none;
      border-radius: 24px;
      background: linear-gradient(90deg, #43cea2, #185a9d);
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    #toggle-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
    }
  </style>
</head>
<body>
  <div id="emoji">👋</div>
  <div id="greeting">안녕</div>
  <button id="toggle-btn" onclick="toggleGreeting()">클릭하세요</button>

  <script>
    const greetings = ["안녕", "반가워요!"];
    const buttonLabels = ["클릭하세요", "다시 클릭!"];
    const emojis = ["👋", "😄"];
    const gradients = [
      "linear-gradient(90deg, #ff5f6d, #ffc371)",
      "linear-gradient(90deg, #38ef7d, #11998e)"
    ];
    let state = 0;

    function toggleGreeting() {
      state = 1 - state;
      const greetingEl = document.getElementById("greeting");
      greetingEl.textContent = greetings[state];
      greetingEl.style.background = gradients[state];
      greetingEl.style.webkitBackgroundClip = "text";
      greetingEl.style.backgroundClip = "text";
      document.getElementById("toggle-btn").textContent = buttonLabels[state];
      const emojiEl = document.getElementById("emoji");
      emojiEl.textContent = emojis[state];
      emojiEl.style.transform = "scale(1.2) rotate(15deg)";
      setTimeout(() => { emojiEl.style.transform = "scale(1) rotate(0deg)"; }, 300);
    }
  </script>
</body>
</html>
